services:
  replica1:
    build: .
    command:
      - pa7
      - server
      - -id
      - "1"
      - -addr
      - :5001
      - -db
      - /data/bank1.db
      - -leader
      - "true"
      - -leader-addr
      - replica1:5001
      - -peers
      - 2=replica2:5002,3=replica3:5003
    ports:
      - "5001:5001"
    volumes:
      - replica1-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5001"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica2:
    build: .
    command:
      - pa7
      - server
      - -id
      - "2"
      - -addr
      - :5002
      - -db
      - /data/bank2.db
      - -leader
      - "false"
      - -leader-addr
      - replica1:5001
    ports:
      - "5002:5002"
    volumes:
      - replica2-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5002"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica3:
    build: .
    command:
      - pa7
      - server
      - -id
      - "3"
      - -addr
      - :5003
      - -db
      - /data/bank3.db
      - -leader
      - "false"
      - -leader-addr
      - replica1:5001
    ports:
      - "5003:5003"
    volumes:
      - replica3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5003"]
      interval: 2s
      timeout: 2s
      retries: 30

  tester:
    build: .
    command:
      - pa7
      - tester
      - -replicas
      - replica1=replica1:5001,replica2=replica2:5002,replica3=replica3:5003
    depends_on:
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
      replica3:
        condition: service_healthy
    profiles:
      - test

volumes:
  replica1-data:
  replica2-data:
  replica3-data:
