services:
  ray-head:
    build: .
    command:
      - sh
      - -c
      - >
        ray start --head
        --port=6379
        --dashboard-host=0.0.0.0
        --ray-client-server-port=10001
        --metrics-export-port=8080
        --num-cpus=1
        --block
    ports:
      - "8265:8265"
      - "10001:10001"

  ray-worker-1:
    build: .
    depends_on:
      - ray-head
    command:
      - sh
      - -c
      - sleep 5 && ray start --address=ray-head:6379 --metrics-export-port=8080 --num-cpus=2 --block

  ray-worker-2:
    build: .
    depends_on:
      - ray-head
    command:
      - sh
      - -c
      - sleep 5 && ray start --address=ray-head:6379 --metrics-export-port=8080 --num-cpus=2 --block

  app:
    build: .
    depends_on:
      - ray-head
      - ray-worker-1
      - ray-worker-2
    environment:
      WIDTH: ${WIDTH:-1600}
      HEIGHT: ${HEIGHT:-1200}
      MAX_ITER: ${MAX_ITER:-300}
      TILES: ${TILES:-16}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    command:
      - sh
      - -c
      - >
        sleep 10 &&
        ray start --address=ray-head:6379 --num-cpus=0 &&
        python -m src.main
        --address auto
        --width $${WIDTH}
        --height $${HEIGHT}
        --max-iter $${MAX_ITER}
        --tiles $${TILES}
        $${EXTRA_ARGS}
    volumes:
      - ./outputs:/app/outputs

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ray-head
      - ray-worker-1
      - ray-worker-2

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
